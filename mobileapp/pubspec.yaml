name: road_sense
description: AI Road Damage Detection & Monitoring System

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 📷 Image handling
  image_picker: ^1.0.7

  # 🌐 API calls
  http: ^1.2.1

  # 📍 GPS location
  geolocator: ^11.0.0

  # 🗺 Map display
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.5

  # 💾 Storage
  path_provider: ^2.1.2
  shared_preferences: ^2.2.3

  # 📊 Charts
  fl_chart: ^0.65.0

  # 📤 Sharing
  share_plus: ^13.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/icons/